[workspace]
resolver = "2"
members = [
    "a22-app",
    "a22-core",
    "a22-db",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
